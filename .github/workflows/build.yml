name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Restore
        run: dotnet restore Sources/SmartTaskbar.sln

      - name: Build Release
        run: dotnet build Sources/SmartTaskbar/SmartTaskbar.csproj -c Release --no-restore

      - name: Publish self-contained (win-x64)
        run: |
          dotnet publish Sources/SmartTaskbar/SmartTaskbar.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o ./publish

      - name: Create zip
        run: |
          Compress-Archive -Path ./publish/SmartTaskbar.exe -DestinationPath ./SmartTaskbar-win-x64.zip -Force

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartTaskbar-win-x64-exe
          path: ./publish/SmartTaskbar.exe
          if-no-files-found: error

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartTaskbar-win-x64-zip
          path: ./SmartTaskbar-win-x64.zip
          if-no-files-found: error
